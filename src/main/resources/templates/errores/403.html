<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/img/ico.jpeg" type="image/x-icon"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <meta http-equiv="refresh" content="2;url=http://localhost:8081/dashboard" />
    <title>Acceso denegado</title>
</head>
<body>
<style>
    #denegado{
        width: 100%;
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
        align-items: center;
    }
    #denegado_texto{
        margin-top: 15%;
        width: 100%;
        text-align: center;
        font-size: 24px;
    }
    #btnregresar{
        background-color: teal;
        color: white;
        font-size: 20px;
        border-radius: 8px;
        padding: 4px;
        text-decoration: none;
        justify-content: center;
    }
    #btnregresar:hover{
        background-color: #a7e0a5;
    }

</style>
<div id="denegado">
    <h4 id="denegado_texto" class="alert alert-danger" role="alert">
        Acceso denegado no tienes permiso para ver esa página
        <br/>
    </h4>
        <a th:href="@{/login}" id="btnregresar" type="button" class="btn btn-primary">Regresar <span> <i class="fas fa-home"></i></span></a>
</div>
</body>
</html>
