<!DOCTYPE html>

                </a>

</header>
<header id="menu-header">
    <div id="header-row">
        <a
                href="#"
                style="visibility: hidden;"
        >
            this one
        </a>
        <a
                th:href="@{/parametros}"
                id="main-menu-download"
                aria-label="Download history measurement"
        >
            <span id="texto-download">Generar reporte</span>
            <span class="fas fa-file-download"></span>
        </a>
    </div>
    <nav id="main-menu" class="main-menu" aria-label="Main menu">
        <a
                href="#main-menu-toggle"
                id="main-menu-close"
                class="menu-close"
                aria-label="Close main menu"
        >
            <span class="fa fa-times"></span>
            <span class="sr-only">Close main menu</span>
            <span aria-hidden="true"></span>
        </a>
        <div id="contenedor-foto" th:each="usu: ${datos_usuario}">
            <!--                    th:src="@{${'/img/' + players.id +'_'+ players.name + '.png'}}"-->
            <!--                    src="../img/user.png"-->
            <img
                    id="user-photo"
                    th:src="@{${'/image/' + usu.foto}}"
                    alt="user photo"
                    width="100px"
                    height="100px"
            />
            <br />
            <h4 id="user-data">
                <span class="user-data" th:text="${usu.nombre}">Luis Vip Huge</span><br />
                <span class="user-data" th:text="${usu.email}">luivph@gmail.com</span>
            </h4>
        </div>
        <ul id="menu-ul">
            <li class="menu-li">
                <a class="menu-a" th:href="@{/cultivo}"><i class="fas fa-seedling"></i> Cultivos</a>
            </li>
            <li class="menu-li" sec:authorize="hasRole('ROLE_ADMIN')">
                <a class="menu-a" th:href="@{/usuarios}"
                ><i class="fas fa-user-plus"></i> Usuarios</a>
            </li>
            <li class="menu-li" sec:authorize="hasRole('ROLE_ADMIN')">
                <a class="menu-a" th:href="@{/categoria}"
                ><i class="far fa-project-diagram"></i> Categorias</a>
            </li>
            <li class="menu-li" sec:authorize="hasRole('ROLE_ADMIN')">
                <a class="menu-a" th:href="@{/producto}"
                ><i class="fas fa-leaf"></i> Productos</a>
            </li>
            <li class="menu-li" sec:authorize="hasRole('ROLE_ADMIN')">
                <a class="menu-a" th:href="@{/dispositivo}"
                ><i class="fas fa-sensor"></i> Dispositivos</a>
            </li>
            <li class="menu-li">
                <a class="menu-a" th:href="@{/dashboard}"><span><i class="fas fa-chart-bar"></i> Dashboard</span></a>
            </li>
            <li class="menu-li">
                <a class="menu-a" th:href="@{/parametros}"><i class="fas fa-file-chart-line"></i> Reportes</a>
            </li>
            <li class="menu-li">
                <a class="menu-a" href="#" id="myBtn"><i class="fas fa-cog"></i> Configuración</a>
            </li>
            <li class="menu-li">
                <a class="menu-a" th:href="@{/ayuda}"><i class="fas fa-life-ring"></i> Ayuda</a>
            </li>
            <li class="menu-li">

            </li>
        </ul>

    <a href="#main-menu-toggle" class="backdrop" hidden tabindex="-1"></a>
</header>

<main style="width:100%; margin-top: 0px">
    <div class="col-titulo">
        <h2 id="titulo"> Datos del usuario</h2>
    </div>

<a th:href="@{/usuarios}" class="regresar"><i class="fas fa-chevron-left"></i> Regresar</a>

<div class="contenedor">
        <form id="form" th:action="@{/guardar}"  method="POST" th:object="${usuario}" enctype="multipart/form-data">
          <div class="row-1">
                <input type="hidden" th:field="*{id}">
                <div class="col-1">
                    <div class="padding-bottom">
                        <input
                                type="text"
                                id="nombre"
                                class="registro-form"
                                placeholder="NOMBRE"
                                autofocus
                                th:field="*{nombre}"
                                required
                        />
                        <span th:text="${error}"></span>
                    </div>
                    <div class="padding-bottom">
                        <input
                                type="text"
                                class="registro-form"
                                id="apellido"
                                th:field="*{apellido}"
                                placeholder="APELLIDO"
                                required
                        />
                    </div>
                    <div class="padding-bottom">
                        <input
                                type="text"
                                id="fechanac"
                                th:field="*{fechanacimiento}"
                                placeholder="FECHA NACIMIENTO"
                                required
                        />
                    </div>
                    <div class="padding-bottom">
                        <input
                                type="number"
                                class="registro-form"
                                id="celular"
                                minlength="9"
                                maxlength="9"
                                th:field="*{celular}"
                                placeholder="CELULAR"
                                required
                        />
                    </div>
                </div>

                <div class="col-2 padding-bottom" style="border: solid 1px black;">
                    <img src="../img/pac.svg" alt="foto" class="foto" id="fotousuario">
                    <input type="hidden" name="ajeno" th:field="*{foto}" id="ajeno"/>
                    <input type="file" name="fotoperfil" id="fotoperfil" onchange="cargarImagen(event)" accept="image/png, image/jpeg, image/jpg"/>
                </div>
          </div>

        <div class="row-2 padding-bottom">
            <div class="col-3">
                <input
                        type="email"
                        placeholder="E-MAIL"
                        maxlength="50"
                        class="entrada-linea"
                        id="correo"
                        th:field="*{email}"
                        required
                />
            </div>
        </div>

        <div class="row-2 padding-bottom">
            <div class="col-3">
            <input
                    type="text"
                    class="entrada-linea"
                    maxlength="50"
                    th:field="*{direccion}"
                    id="direccion"
                    placeholder="DIRECCIÓN"
                    minlength="3"
                    required
            />
            </div>
        </div>

        <div class="row-1 padding-bottom">
            <div class="col-5 padding-bottom">
                <input
                        type="text"
                        class="registro-form"
                        th:field="*{clave}"
                        id="clave"
                        placeholder="CONTRASEÑA"
                        minlength="6"
                        required
                />
            </div>
            <div class="col-6">
                <input
                        type="text"
                        class="registro-form"
                        th:field="*{clave}"
                        id="claveverificar"
                        placeholder="CONFIRME CONTRASEÑA"
                        minlength="6"
                        required
                />
            </div>
        </div>
        <div class="row-2">
            <div class="col-3">
                <input
                        type="submit"
                        class="enviar-form"
                        id="enviar"
                        value="Registrar usuario"
                />
            </div>
        </div>
    </form>
    </div>
</main>

<script>

    fechanac.addEventListener('click', function (){
        document.getElementById('fechanac').setAttribute("type","date");
    });
</script>
<!--</div>-->
<footer th:replace="layout/plantilla2 :: footer"></footer>
<script type="text/javascript" src="../js/registrousuario.js"></script>
<script type="text/javascript" src="../js/fonawesome.js"></script>
</body>
</html>
