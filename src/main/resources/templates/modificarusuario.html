<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="icon" href="/img/ico.jpeg" type="image/x-icon"/>
    <link rel="stylesheet" type="text/css" href="../css/dashboard.css">
    <link rel="stylesheet" type="text/css" href="../css/registrousuario.css">
    <title>Registrar usuario</title>
</head>
<body>
<style>
    #footer-grupo{
        margin-top:3%;
    }
</style>
<header id="header-horizontal">
    <nav id="nav-horizontal">
        <ul id="nav-ul">
            <li class="nav-li">
                <a th:href="@{/dashboard}">
                    <img src="/img/pac.svg" alt="pac">
                </a>
            </li>
            <li class="nav-li">
                <a class="nav-a" href="#">
                    <input type="search" placeholder="Buscar mediciones o reporte"
                           id="buscarreporte" autofocus/>
                    <i class="fas fa-search"></i>
                </a>
            </li>
            <li class="nav-li">
                <a class="nav-a" href="#"><i class="fas fa-comment-alt-dots"></i>
                    <span class="quantity">1</span>
                </a>
                <a class="nav-a" href="#"><i class="fas fa-envelope"></i>
                    <span class="quantity">2</span>
                </a>
                <a class="nav-a" href="#"><i class="fas fa-bell"></i>
                    <span class="quantity">3</span>
                </a>
            </li>
        </ul>
    </nav>
</header>
<header id="menu-header">
    <div id="header-row">
        <a
                href="#main-menu"
                id="main-menu-toggle"
                class="menu-toggle"
                aria-label="Open main menu"
        >
            <span class="sr-only">Open main menu</span>
            <span class="fa fa-bars" area-hidden="true"></span>
        </a>
    </div>
    <nav id="main-menu" class="main-menu" aria-label="Main menu">
        <a
                href="#main-menu-toggle"
                id="main-menu-close"
                class="menu-close"
                aria-label="Close main menu"
        >
            <span class="fa fa-times"></span>
            <span class="sr-only">Close main menu</span>
            <span aria-hidden="true"></span>
        </a>
        <div id="contenedor-foto" th:each="usu: ${datos_usuario}">
            <!--                    th:src="@{${'/img/' + players.id +'_'+ players.name + '.png'}}"-->
            <!--                    src="../img/user.png"-->
            <img
                    id="user-photo"
                    th:src="@{${'../images/' + usu.foto}}"
                    alt="user photo"
                    width="100px"
                    height="100px"
            />
            <br />
            <h4 id="user-data">
                <span class="user-data" th:text="${usu.nombre}">Luis Vip Huge</span><br />
                <span class="user-data" th:text="${usu.email}">luivph@gmail.com</span>
            </h4>
        </div>
        <ul id="menu-ul">
            <li class="menu-li">
                <a class="menu-a" th:href="@{/agregarcultivo}"
                ><i class="fas fa-plus"></i> Registrar cultivo</a
                >
            </li>
            <li class="menu-li">
                <a class="menu-a" th:href="@{/cultivo}"
                ><i class="fas fa-list-ol"></i> Listado de cultivo</a>
            </li>
            <li class="menu-li">
                <a class="menu-a" href="#"
                ><i class="fas fa-file-chart-line"></i> Reportes</a
                >
            </li>
            <li class="menu-li">
                <a class="menu-a" th:href="@{/ayuda}"
                ><i class="fas fa-life-ring"></i> Ayuda</a
                >
            </li>
            <li class="menu-li">
                <a class="menu-a" th:href="@{/logout}">Cerrar sesión</a>
            </li>
        </ul>
    </nav>
    <a href="#main-menu-toggle" class="backdrop" hidden tabindex="-1"></a>
</header>

<main id="contenidoprincipal">
    <div class="col-titulo">
        <h2 id="titulo"> Datos del usuario</h2>
    </div>

<a th:href="@{/usuarios}"><i class="fas fa-chevron-left"></i> Regresar</a>
<div class="contenedor">
        <form id="form" th:action="@{/guardar}"  method="POST" th:object="${usuario}" enctype="multipart/form-data">
          <div class="row-1">
            <input type="hidden" th:field="*{id}">
            <div class="col-1">
                <div class="padding-bottom">
                    <input
                            type="text"
                            id="nombre"
                            class="registro-form"
                            placeholder="NOMBRE"
                            autofocus
                            th:field="*{nombre}"
                            required
                    />
                    <span th:text="${error}"></span>
                </div>
                <div class="padding-bottom">
                    <input
                            type="text"
                            class="registro-form"
                            id="apellido"
                            th:field="*{apellido}"
                            placeholder="APELLIDO"
                            autofocus
                            required
                    />
                </div>
                <div class="padding-bottom">
                    <input
                            type="date"
                            id="fechanac"
                            th:field="*{fechanacimiento}"
                            required
                    />
                </div>
                <div class="padding-bottom">
                    <input
                            type="number"
                            class="registro-form"
                            id="celular"
                            minlength="9"
                            maxlength="9"
                            th:field="*{celular}"
                            placeholder="CELULAR"
                            required
                    />
                </div>
            </div>
            <div class="col-2 padding-bottom">
                <img src="../img/pac.svg" alt="foto" class="foto" id="fotousuario">
                <input type="hidden" name="ajeno" th:field="*{foto}" id="ajeno"/>
                <input type="file" name="fotoperfil" id="fotoperfil" onchange="cargarImagen(event)" accept="image/png, image/jpeg, image/jpg"/>
            </div>
        </div>

        <div class="row-2 padding-bottom">
            <div class="col-3">
                <input
                        type="text"
                        placeholder="E-MAIL"
                        maxlength="50"
                        class="entrada-linea"
                        id="correo"
                        th:field="*{email}"
                        required
                />
            </div>
        </div>

        <div class="row-2 padding-bottom">
            <div class="col-3">
            <input
                    type="text"
                    class="entrada-linea"
                    maxlength="50"
                    th:field="*{direccion}"
                    id="direccion"
                    placeholder="DIRECCIÓN"
                    minlength="3"
                    required
            />
            </div>
        </div>

        <div class="row-1 padding-bottom">
            <div class="col-5 padding-bottom">
                <input
                        type="text"
                        class="registro-form"
                        th:field="*{clave}"
                        id="clave"
                        placeholder="CONTRASEÑA"
                        minlength="3"
                        required
                />
            </div>
            <div class="col-6">
                <input
                        type="text"
                        class="registro-form"
                        th:field="*{clave}"
                        id="claveverificar"
                        placeholder="CONFIRME CONTRASEÑA"
                        minlength="3"
                        required
                />
            </div>
        </div>
        <div class="row-2">
            <div class="col-3">
                <input
                        type="submit"
                        class="enviar-form"
                        id="enviar"
                        value="INGRESAR"
                />
            </div>
        </div>
    </form>
    </div>
</main>
<!--</div>-->
<footer th:replace="layout/plantilla2 :: footer"></footer>
<script type="text/javascript" src="../js/geocode.js"></script>
<script type="text/javascript" src="../js/registrousuario.js"></script>
<script type="text/javascript" src="../js/fonawesome.js"></script>
</body>
</html>
