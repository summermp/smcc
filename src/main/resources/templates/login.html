<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <base href="/">
    <link rel="icon" href="/img/ico.jpeg" type="image/x-icon"/>
    <link rel="stylesheet" type="text/css" href="../css/headerlogin.css">
    <link rel="stylesheet" type="text/css" href="../css/login.css">
    <title>Iniciar sesión</title>
</head>
<body>
<header th:replace="layout/headerlogin :: header"></header>
<div class="rowlogin">
    <div class="col-1">
        <h2 class="form-titulo">INICIAR SESIÓN</h2>
        <form method="post" th:action="@{/login}">
            <div class="rowlogin-1">
                <i class="fas fa-user-shield icon"></i>
                <input
                        type="text"
                        name="username"
                        class="entrada-form"
                        placeholder="Usuario"
                        autofocus
                        required
                />
            </div>
            <div class="rowlogin-2">
                <i class="fas fa-lock icon"></i>
                <input
                        type="password"
                        name="password"
                        class="entrada-form"
                        placeholder="Contraseña"
                        required
                />
            </div>
            <div class="rowlogin-3">
                <input
                        type="submit"
                        class="enviar-form"
                        id="enviar"
                        value="INGRESAR"
                />
            </div>
        </form>
        <div id="ancla">
            <a th:href="@{/olvideclave}" id="ancla-1">¿Olvidé contraseña?</a>
            <a th:href="@{/agregar}" id="ancla-2">Registrar ahora</a>
        </div>
    </div>
    <div class="col-2">
        <img src="../img/agricultor.jpeg" class="login-img" alt="agricultores" />
    </div>
</div>

<footer th:replace="layout/publico :: footer"></footer>
<script type="text/javascript" src="../js/fonawesome.js"></script>
</body>
</html>
