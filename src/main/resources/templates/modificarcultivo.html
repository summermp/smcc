<main style="width:100%; margin-top: 0px">
<div class="col-1">
    <h2 id="titulo"> REGISTRAR CULTIVO</h2>
</div>

<a th:href="@{/cultivo}" class="regresar"><i class="fas fa-chevron-left"></i> Regresar</a>
<form th:action="@{/guardarcultivo}"  method="POST" th:object="${cultivo}" id="form" onsubmit="return mySubmit(this)">
    <div id="row-form">
        <div class="col-1">
            <input type="hidden" th:field="*{id}">
            <select name="cultivo" id="cultivo" th:field="*{producto.id}" required>
               <option th:value="0" disabled>Seleccione cultivo</option>
                <option  th:each="prod : ${productos}" th:value="${prod.id}" th:text="${prod.nombre}"></option>
            </select>
        </div>
        <div class="col-1">
            <input
                    type="text"
                    id="fecha"
                    placeholder="Ingrese fecha siembra"
                    class="registro-form"
                    th:field="*{fechasiembra}"
                    required
            />
        </div>
        <div class="col-1">
            <input
                    type="text"
                    id="ubicacion"
                    class="registro-form"
                    placeholder="Ingrese ubicacion"
                    th:field="*{ubicacion}"
                    required
            />
        </div>
        <div class="col-1">
            <input
                    type="text"
                    id="medida"
                    class="registro-form"
                    placeholder="Ingrese # hectarea (s)"
                    th:field="*{medida}"
                    required
            />
        </div>
        <div class="col-1">
<!--            <span th:text="${idus}">usu </span>-->
            <button type="submit" id="btnenviar">Registrar cultivo</button>
        </div>
    </div>
</form>
</main>
<script>

    window.onload = function (){

        let cultivo_medida=document.getElementById('medida').value;
        let cultivo_siembra=document.getElementById('fecha').value;

        if((parseFloat(cultivo_medida)===0.0)){
            document.getElementById('medida').value="Ingrese # hectarea (s)";
        }

    };

    document.getElementById('fecha').addEventListener('click', function(){
    let fecha=document.getElementById('fecha');
        fecha.setAttribute('type',"date");
        fecha.setAttribute('min',"2021-01-01");
        fecha.setAttribute('max',"2022-12-30");
    });

    document.getElementById('medida').addEventListener('click', function(){
    let medida=document.getElementById('medida');
        medida.setAttribute('type',"number");
        medida.setAttribute('step',"0.1");
        medida.setAttribute('min',"0.5");
        medida.setAttribute('max',"99999999");
        medida.value=0.0;
    });

</script>
<footer th:replace="layout/plantilla2 :: footer"></footer>
<script type="text/javascript" src="../js/fonawesome.js"></script>
